name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: business_os_test
          POSTGRES_USER: business_os
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U business_os"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Provision pgvector and non-superuser app role
        env:
          PGPASSWORD: secret
        run: |
          psql -h localhost -U business_os -d business_os_test -v ON_ERROR_STOP=1 \
            -c "CREATE SCHEMA IF NOT EXISTS extensions" \
            -c "CREATE EXTENSION IF NOT EXISTS vector WITH SCHEMA extensions" \
            -c "CREATE ROLE business_os_app LOGIN PASSWORD 'ci-app-secret' NOSUPERUSER NOBYPASSRLS" \
            -c "ALTER DATABASE business_os_test OWNER TO business_os_app" \
            -c "GRANT USAGE ON SCHEMA extensions TO business_os_app"

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://business_os_app:ci-app-secret@localhost:5432/business_os_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: pytest -q

  frontend-build:
    name: Frontend build (Vite + tsc)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build (tsc + vite)
        run: npm run build
