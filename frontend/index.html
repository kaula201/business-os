<!DOCTYPE html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Business OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          const isViteDev = Boolean(document.querySelector('script[type="module"][src^="/src/"]'));
          if (isViteDev) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
            if ('caches' in window) {
              const keys = await caches.keys();
              await Promise.all(keys.filter((key) => key.startsWith('bos-')).map((key) => caches.delete(key)));
            }
            // A service worker keeps controlling the current page until reload.
            if (navigator.serviceWorker.controller && sessionStorage.getItem('bos_sw_reset') !== 'done') {
              sessionStorage.setItem('bos_sw_reset', 'done');
              window.location.reload();
            } else {
              sessionStorage.removeItem('bos_sw_reset');
            }
            return;
          }
          let workerReloading = false;
          const reloadForWorker = () => {
            if (workerReloading || sessionStorage.getItem('bos_sw_prod_reset') === 'done') return;
            workerReloading = true;
            sessionStorage.setItem('bos_sw_prod_reset', 'done');
            window.location.reload();
          };
          navigator.serviceWorker.addEventListener('controllerchange', reloadForWorker);
          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
            .then(async (registration) => {
              await registration.update();
              await navigator.serviceWorker.ready;
              if (!navigator.serviceWorker.controller) reloadForWorker();
              else sessionStorage.removeItem('bos_sw_prod_reset');
            })
            .catch(() => {});
        });
      }
    </script>
  </body>
</html>
