# Business OS — Nginx reverse proxy
# /api/* → FastAPI backend, ყველაფერი დანარჩენი → frontend (Vite dev)
server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    # ── API → backend ──────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # API docs are not proxied. In development they stay on the backend
    # port only; in production FastAPI does not register them at all.

    # ── Frontend (Vite dev server) ─────────────────────────────────
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
    }
}
