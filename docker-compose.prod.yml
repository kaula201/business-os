# Production stack.
# Postgres, Redis, the API, and the frontend are reachable only on the Compose
# network. The only published ports are 80 (ACME + HTTPS redirect) and 443.
#
# Before the first start:
#   1. Copy .env.example to .env and set POSTGRES_PASSWORD and APP_DB_PASSWORD.
#      Compose exits if either is missing. Use two different strong passwords.
#      APP_DB_PASSWORD is embedded in DATABASE_URL.
#      Generate passwords with: python -c "import secrets; print(secrets.token_urlsafe(32))"
#      Do not use % or $ (or @ : / # ? or spaces).
#      The one-shot migrate service connects as the superuser
#      (MIGRATION_DATABASE_URL, built from POSTGRES_PASSWORD).
#      The backend service never receives POSTGRES_PASSWORD or that URL.
#      It only gets APP_DB_PASSWORD and DATABASE_URL for business_os_app.
#   2. Copy backend/.env.example to backend/.env
#   3. Set JWT_SECRET_KEY (32+ random chars; the API refuses known placeholders)
#   4. Set CORS_ORIGINS to the public origin, e.g. https://app.example.com
#   5. Set SAAS_WEBHOOK_SECRET (unsigned /saas/webhook calls are rejected)
#   6. Place TLS certs in ./certs/fullchain.pem and ./certs/privkey.pem
#      (Let's Encrypt or your CA — this repo does not ship a certificate)
#
#   docker compose -f docker-compose.prod.yml up --build
#
# Demo users are not seeded. APP_ENV=production also disables open registration
# and /docs.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: business_os_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: business_os
      POSTGRES_USER: business_os
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U business_os"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: business_os_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build: ./backend
    container_name: business_os_migrate
    # One-shot. Exits 0 when schema upgrade finishes. The backend will not
    # start until that happens, and this container is the only one that
    # receives the superuser URL.
    restart: "no"
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      APP_DB_PASSWORD: "${APP_DB_PASSWORD:?set APP_DB_PASSWORD}"
      MIGRATION_DATABASE_URL: "postgresql+asyncpg://business_os:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/business_os"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "app.core.migrate_schema"]

  backend:
    build: ./backend
    container_name: business_os_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      APP_DB_PASSWORD: "${APP_DB_PASSWORD:?set APP_DB_PASSWORD}"
      DATABASE_URL: "postgresql+asyncpg://business_os_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@postgres:5432/business_os"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build:
      context: ./frontend
      target: production
    container_name: business_os_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started

  backup:
    image: postgres:16-alpine
    container_name: business_os_backup
    restart: unless-stopped
    entrypoint: |
      sh -c "
        echo '0 3 * * * /scripts/backup.sh' > /etc/crontabs/root &&
        echo '*/5 * * * * /scripts/refresh_mvs.sh' >> /etc/crontabs/root &&
        crond -f -l 2
      "
    environment:
      PGPASSWORD: "${APP_DB_PASSWORD:?set APP_DB_PASSWORD}"
      RETENTION_DAYS: 30
    volumes:
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      - ./scripts/refresh_mvs.sh:/scripts/refresh_mvs.sh:ro
      - backup_data:/backups
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: business_os_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  backup_data:
