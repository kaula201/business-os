# Production stack.
# Postgres, Redis, the API, and the frontend are reachable only on the Compose
# network. The only published ports are 80 (ACME + HTTPS redirect) and 443.
#
# Before the first start:
#   1. Copy backend/.env.example to backend/.env
#   2. Set JWT_SECRET_KEY (32+ random chars; the API refuses known placeholders)
#   3. Set CORS_ORIGINS to the public origin, e.g. https://app.example.com
#   4. Set SAAS_WEBHOOK_SECRET (unsigned /saas/webhook calls are rejected)
#   5. Place TLS certs in ./certs/fullchain.pem and ./certs/privkey.pem
#      (Let's Encrypt or your CA — this repo does not ship a certificate)
#
#   docker compose -f docker-compose.prod.yml up --build
#
# Demo users are not seeded. APP_ENV=production also disables open registration
# and /docs.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: business_os_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: business_os
      POSTGRES_USER: business_os
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U business_os"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: business_os_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    container_name: business_os_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://business_os_app:business_os_app@postgres:5432/business_os
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python -m app.core.migrate_schema && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      target: production
    container_name: business_os_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started

  backup:
    image: postgres:16-alpine
    container_name: business_os_backup
    restart: unless-stopped
    entrypoint: |
      sh -c "
        echo '0 3 * * * /scripts/backup.sh' > /etc/crontabs/root &&
        echo '*/5 * * * * /scripts/refresh_mvs.sh' >> /etc/crontabs/root &&
        crond -f -l 2
      "
    environment:
      PGPASSWORD: business_os_app
      RETENTION_DAYS: 30
    volumes:
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      - ./scripts/refresh_mvs.sh:/scripts/refresh_mvs.sh:ro
      - backup_data:/backups
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: business_os_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  backup_data:
